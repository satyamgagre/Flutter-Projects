name: s8ya
description: S8YA - Premium Offline Music Player
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.6.2
  
  # Audio
  just_audio: ^0.9.42
  audio_service: ^0.18.18
  
  # Media Query
  on_audio_query: ^2.9.0
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Storage
  path_provider: ^2.1.5
  
  # UI
  palette_generator: ^0.3.3+4
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  
  # Utilities
  share_plus: ^10.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0
  rxdart: ^0.28.0
  path: ^1.9.0
  
  # Icons
  cupertino_icons: ^1.0.8
  just_audio_windows: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
